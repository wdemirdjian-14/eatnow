name: Release

# Chaque tag vX.Y.Z produit une archive figée du client et une Release GitHub.
# Le déploiement, lui, est assuré par le workflow « Deploy Ionos ».
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publier la Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Déterminer la version
        id: meta
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Vérifier la cohérence package.json / tag
        run: |
          PKG="$(node -p "require('./package.json').version")"
          if [ "$PKG" != "${{ steps.meta.outputs.version }}" ]; then
            echo "::error::package.json ($PKG) ne correspond pas au tag (${{ steps.meta.outputs.version }})."
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - name: Archiver la version
        run: tar -czf eatnow-v${{ steps.meta.outputs.version }}.tar.gz -C dist .

      - uses: softprops/action-gh-release@v2
        with:
          name: Eatnow v${{ steps.meta.outputs.version }}
          generate_release_notes: true
          files: eatnow-v${{ steps.meta.outputs.version }}.tar.gz
