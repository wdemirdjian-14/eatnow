# ============================================================
# Eatnow — vhost nginx pour eatnow.walautao.fr (serveur Ionos)
#
# Installation :
#   sudo cp deploy/nginx-eatnow.conf /etc/nginx/sites-available/eatnow
#   sudo ln -sf /etc/nginx/sites-available/eatnow /etc/nginx/sites-enabled/eatnow
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certificat TLS (à faire une fois, après le premier reload) :
#   sudo certbot --nginx -d eatnow.walautao.fr
# certbot réécrit ce fichier pour y ajouter les directives ssl_*.
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name eatnow.walautao.fr;

    # Laisse passer le challenge ACME, redirige tout le reste en HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name eatnow.walautao.fr;

    root /var/www/eatnow/current;
    index index.html;

    # --- certbot insère ici ssl_certificate / ssl_certificate_key ---

    access_log /var/log/nginx/eatnow.access.log;
    error_log  /var/log/nginx/eatnow.error.log;

    # ---- API ----
    # Relayée vers le service Node local. Même origine que l'application :
    # le cookie de session reste `SameSite=Strict` et aucun CORS n'est requis.
    location /api/ {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;

        # Les réponses de l'API ne doivent jamais être mises en cache par un
        # intermédiaire : elles dépendent de la session.
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # ---- Photos de plats ----
    # Servies directement depuis le disque, sans passer par Node.
    location /uploads/ {
        alias /var/lib/eatnow/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # Application monopage : toute route inconnue retombe sur index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Les assets sont hachés par Vite : cache long et immuable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html ne doit jamais être mis en cache, sinon une nouvelle
    # version déployée n'est pas vue par les navigateurs déjà venus.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Fichier de version, pratique pour vérifier ce qui tourne réellement.
    location = /version.json {
        add_header Cache-Control "no-store";
        default_type application/json;
    }

    # Le service worker ne doit JAMAIS être servi depuis le cache : un sw.js
    # mis en cache fige l'application sur une version pour toujours.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        default_type application/javascript;
    }

    # Manifeste : type MIME correct, sinon l'installation est refusée.
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # En-têtes de sécurité. La CSP autorise Google Fonts (police Fraunces),
    # les images en data: et les tuiles OpenStreetMap affichées par la carte.
    # `camera=(self)` est indispensable au lecteur de QR code : sans lui le
    # navigateur refuse getUserMedia sans même afficher de demande.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; worker-src 'self'; manifest-src 'self'; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'self'" always;

    # Marge pour les photos de plats envoyées en base64.
    client_max_body_size 12M;
}
