# ============================================================
# Eatnow — vhost nginx pour eatnow.walautao.fr (serveur Ionos)
#
# Installation :
#   sudo cp deploy/nginx-eatnow.conf /etc/nginx/sites-available/eatnow
#   sudo ln -sf /etc/nginx/sites-available/eatnow /etc/nginx/sites-enabled/eatnow
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certificat TLS (à faire une fois, après le premier reload) :
#   sudo certbot --nginx -d eatnow.walautao.fr
# certbot réécrit ce fichier pour y ajouter les directives ssl_*.
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name eatnow.walautao.fr;

    # Laisse passer le challenge ACME, redirige tout le reste en HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name eatnow.walautao.fr;

    root /var/www/eatnow/current;
    index index.html;

    # --- certbot insère ici ssl_certificate / ssl_certificate_key ---

    access_log /var/log/nginx/eatnow.access.log;
    error_log  /var/log/nginx/eatnow.error.log;

    # Application monopage : toute route inconnue retombe sur index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Les assets sont hachés par Vite : cache long et immuable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html ne doit jamais être mis en cache, sinon une nouvelle
    # version déployée n'est pas vue par les navigateurs déjà venus.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Fichier de version, pratique pour vérifier ce qui tourne réellement.
    location = /version.json {
        add_header Cache-Control "no-store";
        default_type application/json;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # En-têtes de sécurité. La CSP autorise Google Fonts (police Fraunces)
    # et les images en data: (photos de plats stockées côté navigateur).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self'; frame-ancestors 'self'" always;

    client_max_body_size 12M;
}
